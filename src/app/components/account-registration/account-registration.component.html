<form (ngSubmit)="onSubmit()" #accountForm="ngForm">
  <div>
    <label for="accountNumber">Número da Conta:</label>
    <input type="text" id="accountNumber" required [(ngModel)]="account.accountNumber" name="accountNumber">
  </div>
  
  <div>
    <label for="customerId">ID do Cliente:</label>
    <input type="text" id="customerId" required [(ngModel)]="account.customerId" name="customerId">
  </div>
  
  <div>
    <label for="accountType">Tipo da Conta:</label>
    <select id="accountType" required [(ngModel)]="account.accountType" name="accountType">
      <option value="savings">Poupança</option>
      <option value="checking">Corrente</option>
    </select>
  </div>
  
  <div>
    <label for="initialBalance">Saldo Inicial:</label>
    <input type="number" id="initialBalance" required [(ngModel)]="account.initialBalance" name="initialBalance">
  </div>
  
  <button type="submit">Cadastrar Conta</button>
</form>
