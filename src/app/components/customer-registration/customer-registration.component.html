<form (ngSubmit)="onSubmit()" #customerForm="ngForm">
  <div>
    <label for="customerId">ID do Cliente:</label>
    <input type="text" id="customerId" name="customerId" ngModel required>
  </div>
  
  <div>
    <label for="fullName">Nome Completo:</label>
    <input type="text" id="fullName" name="fullName" ngModel required>
  </div>
  
  <div>
    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email" ngModel required>
  </div>
  
  <div>
    <label for="birthDate">Data de Nascimento:</label>
    <input type="date" id="birthDate" name="birthDate" ngModel required>
  </div>
  
  <button type="submit">Cadastrar Cliente</button>
</form>
