<div class="transaction-reports">
  <h2>Transaction Reports</h2>
  <form (submit)="fetchTransactions()">
    <label for="accountNumber">Account Number:</label>
    <input type="text" id="accountNumber" [(ngModel)]="accountNumber" name="accountNumber" required>
    <button type="submit">Get Transactions</button>
  </form>

  <div *ngIf="transactions.length > 0">
    <h3>Transaction Details</h3>
    <table>
      <thead>
        <tr>
          <th>Type</th>
          <th>Value</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let transaction of transactions">
          <td>{{ transaction.type }}</td>
          <td>{{ transaction.value }}</td>
          <td>{{ transaction.date }}</td>
        </tr>
      </tbody>
    </table>
    <p>Total Transactions: {{ transactions.length }}</p>
  </div>

  <div *ngIf="!transactions.length && submitted">
    <p>No transactions found for this account.</p>
  </div>
</div>
